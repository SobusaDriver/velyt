<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Encuentra tu carro · velyt</title>
  <meta name="description" content="Responde 8 preguntas y ve los carros que encajan con tu vida. Sin cuenta, sin teléfono y sin correo.">
  <link rel="canonical" href="https://sobusadriver.github.io/velyt/onboarding/">
  <meta property="og:title" content="Encuentra tu carro · velyt">
  <meta property="og:description" content="8 preguntas, sin cuenta. Resultados limitados en la web; el peritaje completo vive en la app.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#06070a">
  <link rel="icon" type="image/png" sizes="48x48" href="../assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/theme.js" defer></script>
  <script src="../assets/analytics.js" defer></script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Encuentra tu carro · velyt",
      "url": "https://sobusadriver.github.io/velyt/onboarding/",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "COP" }
    }
  </script>
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 128px 20px 72px; display: grid; gap: 22px; }
    .progress { height: 3px; border-radius: 999px; background: var(--line); overflow: hidden; }
    #progress-fill { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }
    h1, h2 { font-family: var(--display); letter-spacing: -.02em; line-height: 1.12; }
    h1 { font-size: clamp(2rem, 6.4vw, 2.8rem); }
    h2 { font-size: clamp(1.45rem, 4.6vw, 2rem); }
    .lede { color: var(--text-secondary); margin-top: 8px; font-size: .98rem; }
    .eyebrow { font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; color: var(--text-tertiary); }
    .note { color: var(--text-tertiary); font-size: .78rem; line-height: 1.5; margin-top: 8px; }
    .options { display: grid; gap: 10px; margin-top: 20px; }
    .options.multi { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .option {
      display: flex; align-items: center; gap: 12px; text-align: left; padding: 14px 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      color: var(--text); cursor: pointer; transition: border-color .2s, background .2s;
    }
    .option:hover { border-color: var(--line-strong); }
    .option.is-selected { border-color: var(--accent); background: var(--accent-soft); }
    .option-icon { font-size: 1.3rem; }
    .option-text { display: grid; }
    .option-text small { color: var(--text-secondary); font-size: .8rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; background: var(--accent); color: #fff; padding: 13px 24px; border-radius: 999px; font-weight: 600; border: none; cursor: pointer; }
    .btn[disabled] { opacity: .45; cursor: not-allowed; }
    .ghost { background: transparent; border: 1px solid var(--line); color: var(--text); padding: 12px 20px; border-radius: 999px; cursor: pointer; }
    .ghost:hover { border-color: var(--line-strong); }
    .ghost.small { padding: 8px 14px; font-size: .82rem; margin-top: 8px; display: inline-block; text-decoration: none; }
    .budget { display: grid; gap: 10px; margin-top: 20px; }
    .budget label { font-size: .82rem; color: var(--text-secondary); display: flex; justify-content: space-between; }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .plan { margin-top: 16px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip { background: transparent; border: 1px solid var(--line); color: var(--text-secondary); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: .85rem; }
    .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--text); font-weight: 600; }
    .results { display: grid; gap: 12px; margin-top: 20px; }
    .car { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .car img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; }
    .car-noimg { height: 90px; display: grid; place-items: center; font-size: 2rem; background: var(--bg-soft); border-radius: 10px; }
    .car h3 { font-family: var(--display); font-size: 1.1rem; margin-top: 10px; }
    .car-meta { color: var(--text-secondary); font-size: .82rem; margin-top: 4px; }
    .car-price { font-family: var(--display); font-weight: 600; margin-top: 6px; }
  </style>
</head>
<body>
  <nav id="nav">
    <div class="container">
      <a href="../" class="brand">
        <img src="../assets/favicon.png" alt="" class="brand-icon" width="30" height="30">
        <span>velyt</span>
      </a>
      <div class="nav-actions">
        <a class="lang-toggle" href="../calculadora/">Cuota</a>
        <a class="lang-toggle" href="./" aria-current="page">Mi carro</a>
        <button type="button" class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
          <svg id="theme-icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" role="img" aria-label="Tema"><title>Cambiar tema</title><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="progress" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="100"><span id="progress-fill"></span></div>
    <div id="flow" aria-live="polite"></div>
  </main>

  <footer>
    <div class="container">
      <p>velyt &mdash; Colombia &middot; Tu pr&oacute;ximo carro sin sorpresas</p>
      <p><a href="../privacidad.html">Pol&iacute;tica de privacidad</a></p>
    </div>
  </footer>

  <script src="../assets/quickmatch.js"></script>
  <script src="../assets/onboarding-data.js"></script>
  <script src="../assets/onboarding.js"></script>
</body>
</html>
